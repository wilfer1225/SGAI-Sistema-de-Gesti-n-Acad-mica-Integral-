services:
  postgres:
    image: postgres:16-alpine
    container_name: sgai-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: sgai
      POSTGRES_USER: sgai
      POSTGRES_PASSWORD: sgai_dev_password
    ports:
      - "5432:5432"
    volumes:
      - sgai_postgres_data:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./database/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
      - ./database/migrate_portal.sql:/docker-entrypoint-initdb.d/03-portal.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sgai -d sgai"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  sgai_postgres_data:
